name: AutoDrive CI

on:
  push:
    branches: ["Final-Project"]
  pull_request:
    branches: ["Final-Project"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: autodrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autodrive_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Verify Alembic migration lifecycle
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/autodrive_test
          SECRET_KEY: ci-secret-key
        run: |
          uv run flask --app run:app db upgrade
          uv run flask --app run:app db downgrade
          uv run flask --app run:app db upgrade

      - name: Run unit and PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/autodrive_test
          SECRET_KEY: ci-secret-key
        run: uv run pytest -q
