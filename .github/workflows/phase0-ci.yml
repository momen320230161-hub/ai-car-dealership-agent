name: Phase 1 CI

on:
  push:
    branches: ["Final-Project"]
  pull_request:
    branches: ["Final-Project"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: autodrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Verify Alembic migrations (upgrade -> downgrade -> re-upgrade)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/autodrive_test
          SECRET_KEY: ci-secret-key
        run: |
          uv run flask --app run:app db upgrade
          uv run flask --app run:app db downgrade
          uv run flask --app run:app db upgrade

      - name: Run pytest (Unit & PostgreSQL Integration)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/autodrive_test
          SECRET_KEY: ci-secret-key
        run: uv run pytest -v

      - name: Build Docker image
        run: docker build --tag autodrive-egypt:phase1 .

      - name: Smoke test Docker container
        run: |
          docker run --detach \
            --name autodrive-phase1-smoke \
            --publish 5050:5000 \
            --env SECRET_KEY=ci-phase1-secret \
            --env DATABASE_URL=sqlite+pysqlite:///:memory: \
            autodrive-egypt:phase1

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:5050/health; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs autodrive-phase1-smoke
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:5050/health/db

      - name: Clean up Docker smoke container
        if: always()
        run: docker rm --force autodrive-phase1-smoke 2>/dev/null || true

