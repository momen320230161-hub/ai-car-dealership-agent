name: Phase 0 CI

on:
  push:
    branches: ["Final-Project"]
  pull_request:
    branches: ["Final-Project"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Build Docker image
        run: docker build --tag autodrive-egypt:phase0 .

      - name: Smoke test Docker container
        run: |
          docker run --detach \
            --name autodrive-phase0-smoke \
            --publish 5050:5000 \
            --env SECRET_KEY=ci-phase0-secret \
            --env DATABASE_URL=sqlite+pysqlite:///:memory: \
            autodrive-egypt:phase0

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:5050/health; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs autodrive-phase0-smoke
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:5050/health/db

      - name: Clean up Docker smoke container
        if: always()
        run: docker rm --force autodrive-phase0-smoke 2>/dev/null || true
